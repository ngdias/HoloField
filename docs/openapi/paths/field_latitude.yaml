get:
  operationId: LatitudeBandsField
  tags:
    - Boundary Fields
  summary: Evaluate the Latitude Bands field
  description: >
    Returns a sinusoidal latitude-band pattern based on the angular position
    derived from the Z coordinate. The Z coordinate must be in the range [-1, 1].
    It is intended for testing and debugging the projection pipeline.

  parameters:
    - $ref: '../openapi.yaml#/components/parameters/XCoordinate'
    - $ref: '../openapi.yaml#/components/parameters/YCoordinate'
    - $ref: '../openapi.yaml#/components/parameters/ZCoordinate'

  responses:
    "200":
      description: Value returned by the field
      content:
        application/json:
          schema:
            type: object
            required:
              - value
            properties:
              value:
                type: number
                minimum: 0
                maximum: 1
                description: Value returned by the field.

    "400":
      $ref: '../openapi.yaml#/components/responses/BadRequest'

    "500":
      $ref: '../openapi.yaml#/components/responses/InternalServerError'