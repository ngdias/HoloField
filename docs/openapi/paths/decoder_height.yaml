get:
  operationId: HeightFieldDecoder
  tags:
    - Decoders
  summary: Evaluate the height scalar field
  description: >
    Returns a signed scalar field value based on the selected boundary field.
    The value represents the difference between the point's Z coordinate and
    the boundary height at the corresponding position.
    Positive values indicate points above the boundary.
    Negative values indicate points below the boundary.

  parameters:

    - $ref: '../openapi.yaml#/components/parameters/BoundaryField'
    - $ref: '../openapi.yaml#/components/parameters/XCoordinate'
    - $ref: '../openapi.yaml#/components/parameters/YCoordinate'
    - $ref: '../openapi.yaml#/components/parameters/ZCoordinate'

  responses:
    "200":
      description: Scalar field value
      content:
        application/json:
          schema:
            type: object
            required:
              - value
            properties:
              value:
                type: number
                description: >
                  Signed scalar field value. Positive values indicate points
                  above the boundary, negative values indicate points below
                  the boundary.

    "400":
      $ref: '../openapi.yaml#/components/responses/BadRequest'

    "500":
      $ref: '../openapi.yaml#/components/responses/InternalServerError'